    <!-- Single Page App URL restoration for GitHub Pages -->
    <script>
      (function() {
        var search = window.location.search;
        if (search.startsWith('?/')) {
          var decoded = search.slice(1).split('&')[0].replace(/~and~/g, '&');
          window.history.replaceState(null, null,
            window.location.pathname.replace(/\/$/, '') + decoded + window.location.hash
          );
        } else if (search.includes('p=')) {
          var match = search.match(/[?&]p=([^&]+)/);
          if (match && match[1]) {
            var decodedPath = decodeURIComponent(match[1]);
            window.history.replaceState(null, null,
              window.location.pathname.replace(/\/$/, '') + decodedPath + window.location.hash
            );
          }
        }
      })();
    </script>
